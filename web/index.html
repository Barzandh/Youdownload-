<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>VidVault</title>
<meta name="description" content="Save videos from YouTube, Instagram, Facebook, X, TikTok, Threads and Snapchat to watch offline.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VidVault">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<script>
  // apply theme before first paint to avoid a white flash
  try {
    var s = JSON.parse(localStorage.getItem('vv.settings') || '{}');
    var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
    document.documentElement.dataset.accent = s.accent || 'blue';
    if (s.lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
  } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="tb-l" id="tbLeft"></div>
    <h1 id="title">VidVault</h1>
    <div class="tb-r" id="tbRight"></div>
  </header>
  <main id="main"></main>
  <nav class="toolbar hidden" id="toolbar"></nav>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="layer"></div>
<div class="toast" id="toast"></div>
<noscript>VidVault needs JavaScript.</noscript>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>

# Every 6 hours, checks which free download servers work and publishes live.json on the "diag" branch.
name: Check download servers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/diag/**', 'web/instances.json', '.github/workflows/diag.yml']
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: diag
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/diag/health.py
      - name: Publish live.json
        run: |
          git config --global user.name "VidVault CI"; git config --global user.email "ci@users.noreply.github.com"
          cd out && git init -q -b diag && git add -A && git commit -q -m "Server check $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
